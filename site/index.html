<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#163b5c"><title>Xếp chỗ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div><span class="eyebrow">QUẢN LÝ LỚP HỌC</span><h1>Xếp chỗ ngồi</h1></div><button id="refresh" class="icon-btn" aria-label="Tải lại">↻</button></header>
  <main id="app"><div class="loading">Đang tải sơ đồ…</div></main>
  <nav class="bottom-nav" id="nav">
    <button data-view="overview" class="active">⌂<span>Tổng quan</span></button>
    <button data-view="female">♁<span>Bên Nữ</span></button>
    <button data-view="male">♂<span>Bên Nam</span></button>
  </nav>
  <div id="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
